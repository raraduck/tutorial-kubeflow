# dcgm-exporter.yaml

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: monitoring          # kube-system → monitoring으로 변경 (prometheus stack과 같은 namespace)
  labels:
    app: dcgm-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  template:
    metadata:
      labels:
        app: dcgm-exporter
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      hostNetwork: true
      hostPID: true
      containers:
      - name: dcgm-exporter
        image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          privileged: true
        ports:
        - name: metrics
          containerPort: 9400
        volumeMounts:
        - name: pod-gpu-resources
          readOnly: true
          mountPath: /var/lib/kubelet/pod-resources
      volumes:
      - name: pod-gpu-resources
        hostPath:
          path: /var/lib/kubelet/pod-resources
---
# Service 제거 → PodMonitor로 대체
# ClusterIP Service를 거치면 pod IP로 수집되는 문제가 있었음
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dcgm-exporter
  namespace: monitoring          # kube-system → monitoring으로 변경
  labels:
    app: dcgm-exporter
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
    - monitoring                 # DaemonSet이 있는 namespace 명시
  selector:
    matchLabels:
      app: dcgm-exporter
  podMetricsEndpoints:
  - port: metrics
    interval: 30s
    relabelings:
    # 노드 이름을 node 라벨로 추가 (지난주 설정 유지)
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
    # DCGM Exporter Pod 이름 (디버깅용, 지난주 설정 유지)
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: exporter_pod
