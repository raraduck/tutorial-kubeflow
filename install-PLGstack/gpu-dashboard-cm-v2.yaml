apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-availability-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gpu-availability.json: |
    {
      "title": "GPU Availability by Node",
      "uid": "gpu-availability",
      "folderUid": "gpu-monitor",
      "timezone": "Asia/Seoul",
      "refresh": "30s",
      "schemaVersion": 36,
      "tags": ["gpu", "nvidia"],
      "panels": [
        {
          "id": 1,
          "title": "전체 보유 GPU",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "colorMode": "background", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "unit": "short"
            }
          },
          "targets": [{
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "sum(kube_node_status_allocatable{resource=\"nvidia_com_gpu\"})",
            "legendFormat": "전체 GPU"
          }]
        },
        {
          "id": 2,
          "title": "사용 중인 GPU",
          "type": "stat",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "colorMode": "background", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "red" },
              "unit": "short"
            }
          },
          "targets": [{
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "sum(kube_pod_container_resource_requests{resource=\"nvidia_com_gpu\"})",
            "legendFormat": "사용 중"
          }]
        },
        {
          "id": 3,
          "title": "잔여 GPU",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "colorMode": "background", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red",    "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green",  "value": 5 }
                ]
              }
            }
          },
          "targets": [{
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "sum(kube_node_status_allocatable{resource=\"nvidia_com_gpu\"}) - sum(kube_pod_container_resource_requests{resource=\"nvidia_com_gpu\"})",
            "legendFormat": "잔여 GPU"
          }]
        },
        {
          "id": 4,
          "title": "GPU 사용률 (전체 평균)",
          "type": "stat",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "colorMode": "background", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red",    "value": 80 }
                ]
              }
            }
          },
          "targets": [{
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "avg(DCGM_FI_DEV_GPU_UTIL)",
            "legendFormat": "평균 사용률"
          }]
        },
        {
          "id": 5,
          "title": "노드별 잔여 GPU",
          "type": "bargauge",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "orientation": "vertical",
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "displayMode": "gradient",
            "text": {}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 4,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "#ef4444", "value": null },
                  { "color": "#eab308", "value": 1 },
                  { "color": "#84cc16", "value": 2 },
                  { "color": "#22c55e", "value": 3 }
                ]
              }
            }
          },
          "targets": [{
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "kube_node_status_allocatable{resource=\"nvidia_com_gpu\"} - on(node) group_left() sum by (node) (kube_pod_container_resource_requests{resource=\"nvidia_com_gpu\"})",
            "legendFormat": "{{node}}",
            "instant": true
          },
          {
            "refId": "B",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "kube_node_status_allocatable{resource=\"nvidia_com_gpu\"} unless on(node) sum by (node) (kube_pod_container_resource_requests{resource=\"nvidia_com_gpu\"})",
            "legendFormat": "{{node}}",
            "instant": true
          }]
        },
        {
          "id": 6,
          "title": "노드별 GPU 상세 테이블",
          "type": "table",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "sortBy": [{ "displayName": "노드", "desc": false }],
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "align": "center" }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "잔여 GPU" },
                "properties": [
                  { "id": "custom.displayMode", "value": "color-background" },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "#84cc16", "value": null },
                        { "color": "transparent", "value": 4 },
                        { "color": "#84cc16", "value": 3 },
                        { "color": "#a3e635", "value": 2 },
                        { "color": "#f97316", "value": 1 },
                        { "color": "#ef4444", "value": 0 }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "사용 중인 GPU" },
                "properties": [
                  { "id": "custom.displayMode", "value": "color-background" },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "transparent", "value": null },
                        { "color": "transparent", "value": 0 },
                        { "color": "#84cc16", "value": 1 },
                        { "color": "#a3e635", "value": 2 },
                        { "color": "#f97316", "value": 3 },
                        { "color": "#ef4444", "value": 4 }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kube_node_status_allocatable{resource=\"nvidia_com_gpu\"}",
              "legendFormat": "{{node}}",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kube_node_status_allocatable{resource=\"nvidia_com_gpu\"} - on(node) group_left() sum by (node) (kube_pod_container_resource_requests{resource=\"nvidia_com_gpu\"})",
              "legendFormat": "{{node}}",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"nvidia_com_gpu\"})",
              "legendFormat": "{{node}}",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "node": "노드",
                  "Value #A": "전체 GPU",
                  "Value #B": "잔여 GPU",
                  "Value #C": "사용 중인 GPU"
                },
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "resource": true,
                  "job": true,
                  "instance": true,
                  "namespace": true,
                  "pod": true,
                  "container": true,
                  "endpoint": true,
                  "service": true,
                  "unit": true,
                  "Value #B": true
                }
              }
            }
          ]
        },
        {
          "id": 7,
          "title": "노드별 GPU 사용률 추이",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 22, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"nvidia_com_gpu\"}) / on(node) kube_node_status_allocatable{resource=\"nvidia_com_gpu\"} * 100",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 8,
          "title": "사용자별 GPU 사용량 추이",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 30, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (namespace) (kube_pod_container_resource_requests{resource=\"nvidia_com_gpu\", namespace!~\"kube-system|monitoring|longhorn-system|ingress-nginx|istio-system|knative-serving|cert-manager|harbor|nfs-provisioner|argo|auth|oauth2-proxy|kubeflow\"})",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 9,
          "title": "전체 GPU 사용률 추이",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 30, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(kube_pod_container_resource_requests{resource=\"nvidia_com_gpu\"}) / sum(kube_node_status_allocatable{resource=\"nvidia_com_gpu\"}) * 100",
              "legendFormat": "전체 할당률"
            }
          ]
        }
      ],
      "templating": { "list": [] }
    }
