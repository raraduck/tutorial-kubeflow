apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-server
  namespace: kubeflow
spec:
  selector:
    matchLabels:
      app: argo-server
  template:
    metadata:
      labels:
        app: argo-server
    spec:
      serviceAccountName: argo-server # 1번에서 생성한 SA 참조
      containers:
      - name: argo-server
        image: quay.io/argoproj/argocli:v3.5.14
        args: [ server, --auth-mode=server ]
        ports:
        - containerPort: 2746
---
apiVersion: v1
kind: Service
metadata:
  name: argo-server
  namespace: kubeflow
spec:
  selector:
    app: argo-server
  ports:
  - port: 2746
    targetPort: 2746
---
apiVersion: v1
kind: Service
metadata:
  name: argo-server-nodeport
  namespace: kubeflow
spec:
  type: NodePort
  selector:
    app: argo-server
  ports:
  - port: 2746
    targetPort: 2746
    nodePort: 32746
