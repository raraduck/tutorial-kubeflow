# --------------------------------------------------------------
# Configuration file for the Kubeflow Notebooks UI.
#
# About the `readOnly` configs:
#  - when `readOnly` is set to "true", the respective option
#    will be disabled for users and only set by the admin
#  - when 'readOnly' is missing, it defaults to 'false'
# --------------------------------------------------------------

spawnerFormDefaults:
  ################################################################
  # Container Images
  ################################################################
  allowCustomImage: true
  hideRegistry: true
  hideTag: false

  imagePullPolicy:
    readOnly: false
    value: IfNotPresent

  image:
    value: 10.246.246.89:30002/kubeflow/jupyter-custom:v1.0
    options:
      - ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-scipy:v1.10.0
      - ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-pytorch-full:v1.10.0
      - ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-pytorch-cuda-full:v1.10.0
      - ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-pytorch-gaudi-full:v1.10.0
      - ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-tensorflow-full:v1.10.0
      - ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-tensorflow-cuda-full:v1.10.0
      - 10.246.246.89:30002/kubeflow/jupyter-custom:v1.0

  imageGroupOne:
    value: ghcr.io/kubeflow/kubeflow/notebook-servers/codeserver-python:v1.10.0
    options:
      - ghcr.io/kubeflow/kubeflow/notebook-servers/codeserver-python:v1.10.0

  imageGroupTwo:
    value: ghcr.io/kubeflow/kubeflow/notebook-servers/rstudio-tidyverse:v1.10.0
    options:
      - ghcr.io/kubeflow/kubeflow/notebook-servers/rstudio-tidyverse:v1.10.0

  ################################################################
  # CPU Resources
  ################################################################
  cpu:
    readOnly: false
    value: "4"
    limitFactor: "1.2"

  ################################################################
  # Memory Resources
  ################################################################
  memory:
    readOnly: false
    value: "40.0Gi"
    limitFactor: "1.2"

  ################################################################
  # GPU/Device-Plugin Resources
  ################################################################
  gpus:
    readOnly: false
    value:
      vendor: "nvidia.com/gpu"
      vendors:
        - limitsKey: "nvidia.com/gpu"
          uiName: "NVIDIA"
      num: "1"

  ################################################################
  # Workspace Volumes
  ################################################################
  workspaceVolume:
    readOnly: false  # <--- 핵심: true로 변경하여 UI 조작(Attach Existing 등) 불가 상태로 고정
    value:
      mount: /home/jovyan
      newPvc:
        metadata:
          name: "{notebook-name}-workspace"
        spec:
          resources:
            requests:
              storage: 500Gi
          accessModes:
            - ReadWriteMany

  ################################################################
  # Data Volumes
  ################################################################
  dataVolumes:
    readOnly: false  # <--- 핵심: true로 변경하여 UI 조작(Attach Existing 등) 불가 상태로 고정
    value: []

  ################################################################
  # Affinity (GPU 노드 선택 기능)
  ################################################################
  affinityConfig:
    readOnly: false
    value: ""
    options:
      - configKey: "gpu-v100"
        displayName: "NVIDIA Tesla V100"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "nvidia.com/gpu.model"
                      operator: "In"
                      values:
                        - "v100"

      - configKey: "gpu-p100"
        displayName: "NVIDIA Tesla P100"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "nvidia.com/gpu.model"
                      operator: "In"
                      values:
                        - "p100"

      - configKey: "gpu-rtx3090"
        displayName: "NVIDIA RTX 3090"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "nvidia.com/gpu.model"
                      operator: "In"
                      values:
                        - "rtx3090"

      - configKey: "gpu-rtx4090"
        displayName: "NVIDIA RTX 4090"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "nvidia.com/gpu.model"
                      operator: "In"
                      values:
                        - "rtx4090"

      - configKey: "gpu-rtx5000"
        displayName: "NVIDIA Quadro RTX 5000"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "nvidia.com/gpu.model"
                      operator: "In"
                      values:
                        - "rtx5000"

      - configKey: "gpu-rtx4000"
        displayName: "NVIDIA Quadro RTX 4000"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "nvidia.com/gpu.model"
                      operator: "In"
                      values:
                        - "rtx4000"

  ################################################################
  # Tolerations
  ################################################################
  tolerationGroup:
    readOnly: false
    value: ""
    options: []

  ################################################################
  # Shared Memory
  ################################################################
  shm:
    readOnly: false
    value: true

  ################################################################
  # PodDefaults
  ################################################################
  configurations:
    readOnly: false
    value: []

  ################################################################
  # Environment
  ################################################################
  environment:
    readOnly: false
    value: {}