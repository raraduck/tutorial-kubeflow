apiVersion: v1
kind: ServiceAccount
metadata:
  name: esjeong # 사용자 이름으로 변경
  namespace: aiops
---
# SA의 토큰을 명시적으로 생성 (k8s 1.24+ 필수)
apiVersion: v1
kind: Secret
metadata:
  name: esjeong-token
  namespace: aiops
  annotations:
    kubernetes.io/service-account.name: esjeong
type: kubernetes.io/service-account-token
---
# rolebinding-esjeong.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-full-access-esjeong
  namespace: aiops
subjects:
- kind: ServiceAccount
  name: esjeong
  namespace: aiops
roleRef:
  kind: Role
  name: aiops-full-access
  apiGroup: rbac.authorization.k8s.io
