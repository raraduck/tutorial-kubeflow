apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: engine-t1-seg
  namespace: aiops
  labels:
    app.kubernetes.io/part-of: aiops
    engine: t1-seg
    gpu: rtx30
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/target: "1"
        autoscaling.knative.dev/scale-to-zero-pod-retention-period: "5m"
    spec:
      timeoutSeconds: 600
      containerConcurrency: 1
      imagePullSecrets:
        - name: acr-secret
      containers:
        - image: neurophet.azurecr.io/engine-t1-seg:2.5.1
          ports:
            - containerPort: 9001
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              cpu: "2"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /server
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /server
              port: 9001
            initialDelaySeconds: 60
            periodSeconds: 30
---
