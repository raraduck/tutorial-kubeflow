apiVersion: "kubeflow.org/v1alpha1"
kind: PodDefault
metadata:
  name: shared-datasets-ro
  namespace: dwnkim  # <--- 적용할 유저 네임스페이스로 변경하세요! (여러 곳이면 여러 번 배포)
spec:
  desc: "공용 데이터셋 연결 (ResearchData, YDB2, YDB3 - ReadOnly)"
  selector:
    matchLabels:
      shared-datasets-ro: "true"
  volumeMounts:
    # 1. Research Data 마운트
    - name: researchdata
      mountPath: /mnt/ResearchData
      readOnly: true
    # 2. YDB2 마운트
    - name: ydb2
      mountPath: /mnt/YDB2
      readOnly: true
    # 3. YDB3 마운트
    - name: ydb3
      mountPath: /mnt/YDB3
      readOnly: true
  volumes:
    # 실제 NFS 서버 정보 입력 (PV/PVC를 거치지 않고 직접 연결하여 충돌 방지)
    - name: researchdata
      nfs:
        server: 192.168.0.200       # NFS 서버 IP
        path: /volume1/ResearchData # NFS 실제 경로
        readOnly: true
    - name: ydb2
      nfs:
        server: 192.168.0.200
        path: /volume3/YDB2
        readOnly: true
    - name: ydb3
      nfs:
        server: 192.168.0.200
        path: /volume2/YDB3
        readOnly: true