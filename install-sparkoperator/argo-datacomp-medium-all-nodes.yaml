apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: datacomp-download-
  namespace: dwnkim
  labels:
    workflows.argoproj.io/archive-strategy: "false"
spec:
  entrypoint: datacomp-distributed-download
  serviceAccountName: default-editor
  parallelism: 6

  podSpecPatch: |
    affinity:
      # 1. 노드 선택 (gn137 배제)
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
              - gn143
              - gn150
    initContainers:
    - name: init
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
    containers:
    - name: wait
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
  
  volumes:
  - name: metadata-storage
    hostPath: {path: /data1/datacomp-medium/filtered_metadata_en, type: Directory}
  - name: output-storage
    hostPath: {path: /data2, type: Directory}

  templates:
  - name: datacomp-distributed-download
    steps:
    - - name: generate-list
        template: list-parquet-files
    - - name: download-worker
        template: img2dataset-worker
        arguments:
          parameters:
          - name: parquet-file
            value: "{{item}}"
        withParam: "{{steps.generate-list.outputs.parameters.file-list}}"

  # [Template 1: 파일 리스트 생성기 (변경 없음)]
  - name: list-parquet-files
    container:
      image: dwnusa/img2dataset-worker:v1
      command: ["/bin/bash", "-c"]
      args:
      - |
        python3 << 'EOF'
        import os, json, glob
        search_path = "/input_meta"
        output_file = "/tmp/output.json"
        if not os.path.exists(search_path): exit(1)
        files = glob.glob(os.path.join(search_path, "**", "*.parquet"), recursive=True)
        files.sort()
        print(f"Found {len(files)} parquet files")
        with open(output_file, 'w') as f: json.dump(files, f)
        EOF
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: 1, memory: 2Gi}
      volumeMounts:
      - name: metadata-storage
        mountPath: /input_meta
        readOnly: true
    outputs:
      parameters:
      - name: file-list
        valueFrom: {path: /tmp/output.json}

  # [Template 2: 다운로드 워커 (최적화 적용)]
  - name: img2dataset-worker
    inputs:
      parameters:
      - name: parquet-file
    retryStrategy:
      limit: 2
    activeDeadlineSeconds: 21600
    container:
      image: dwnusa/img2dataset-worker:v1
      # [설정] Albumentations 경고 무시 환경변수 추가
      env:
      - name: NO_ALBUMENTATIONS_UPDATE
        value: "1"
      command: ["/bin/bash", "-c"]
      args:
      - |
        AVAILABLE_KB=$(df -P /output_data | awk 'NR==2 {print $4}')
        LIMIT_KB=104857600
        if [ "$AVAILABLE_KB" -lt "$LIMIT_KB" ]; then exit 1; fi

        INPUT_FILE="{{inputs.parameters.parquet-file}}"
        FILENAME=$(basename "$INPUT_FILE" .parquet)
        OUTPUT_DIR="/output_data/$FILENAME"
        
        echo "Processing: $INPUT_FILE"
        
        # [주요 변경 사항 설명]
        # 1. processes_count: 2 -> 6 (CPU 활용 극대화, limits가 8이므로 6~7 권장)
        # 2. min_image_size: 200 -> 50 (작은 이미지 resize 실패 방지, 데이터 확보량 증가)
        # 3. request_timeout: 10 -> 20 (다운로드 실패율 약간 감소 기대)
        # 4. thread_count: 32 -> 64 (I/O 대기 시간 활용)
        
        img2dataset \
          --url_list "$INPUT_FILE" \
          --input_format "parquet" \
          --url_col "url" \
          --caption_col "text" \
          --output_format webdataset \
          --output_folder "$OUTPUT_DIR" \
          --processes_count 6 \
          --thread_count 64 \
          --image_size 224 \
          --resize_mode center_crop \
          --encode_format webp \
          --encode_quality 75 \
          --retries 2 \
          --min_image_size 50 \
          --request_timeout 50 \
          --enable_wandb False
        
        echo "✅ Completed: $FILENAME"
      resources:
        requests:
          cpu: 4
          memory: 16Gi
        limits:
          cpu: 8
          memory: 64Gi
      volumeMounts:
      - name: metadata-storage
        mountPath: /input_meta
        readOnly: true
      - name: output-storage
        mountPath: /output_data
        readOnly: false