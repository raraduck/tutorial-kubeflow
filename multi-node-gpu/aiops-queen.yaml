# 1. Namespace 생성
apiVersion: v1
kind: Namespace
metadata:
  name: aiops
---
# 2. ServiceAccount 생성 (Bastion Pod가 사용할 신분증)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-king-sa
  namespace: aiops
---
# [추가] 노드(Node) 조회 전용 ClusterRole 생성
# 기본 'view' 권한에는 노드 정보 조회가 빠져 있으므로 직접 만듭니다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-viewer
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"] 
---
# 3. RBAC 설정: "왕처럼 군림"하기 위한 ClusterAdmin 권한 부여
# 주의: 이 권한은 네임스페이스를 넘어 클러스터 전체(Node 조회 등)를 제어합니다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-global-view-binding
subjects:
- kind: ServiceAccount
  name: aiops-king-sa
  namespace: aiops
roleRef:
  kind: ClusterRole
  name: view  # k8s 내장 Role: 읽기 전용 (Node, Pod, Service 등 조회 가능)
  apiGroup: rbac.authorization.k8s.io
---
# 3-2. [Local] 'aiops' 네임스페이스 내 전용 관리 권한
# 'aiops' 안에서는 생성, 삭제, 수정 등 모든 권한을 가집니다.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-local-admin-binding
  namespace: aiops # 중요: 이 권한은 aiops 안에서만 작동함
subjects:
- kind: ServiceAccount
  name: aiops-king-sa
  namespace: aiops
roleRef:
  kind: ClusterRole
  name: admin # k8s 내장 Role: 해당 네임스페이스 내 관리자 권한
  apiGroup: rbac.authorization.k8s.io
---
# 4. ConfigMap: 초기화 스크립트 (SSH 서버 설정 및 Kubectl 설치)
apiVersion: v1
kind: ConfigMap
metadata:
  name: bastion-init-script
  namespace: aiops
data:
  setup.sh: |
    #!/bin/bash
    set -e

    # 기본 패키지 설치 (SSH, Curl, Vim, Git 등)
    apt-get update && apt-get install -y openssh-server curl vim git sudo less dnsutils iputils-ping

    # Kubectl 설치 (현재 아키텍처에 맞게 다운로드)
    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    chmod +x kubectl
    mv kubectl /usr/local/bin/

    # SSH 디렉토리 생성
    mkdir -p /run/sshd

    # 'devops' 사용자 생성 (비밀번호: aiops1234 - 보안을 위해 추후 변경 권장)
    useradd -m -s /bin/bash devops
    echo "devops:aiops1234" | chpasswd
    usermod -aG sudo devops

    # 5. [중요] 쿠버네티스 API 서버 환경변수를 devops 사용자에게 주입
    # 컨테이너 실행 시점의 root는 이 변수를 알고 있으므로, 이를 devops의 프로필에 영구 기록함
    echo "export KUBERNETES_SERVICE_HOST=$KUBERNETES_SERVICE_HOST" >> /home/devops/.bashrc
    echo "export KUBERNETES_SERVICE_PORT=$KUBERNETES_SERVICE_PORT" >> /home/devops/.bashrc

    # SSH 키 설정 (여기에 본인의 id_rsa.pub 내용을 넣으면 키 접속 가능)
    # mkdir -p /home/devops/.ssh
    # echo "ssh-rsa AAAA..." > /home/devops/.ssh/authorized_keys
    # chown -R devops:devops /home/devops/.ssh
    # chmod 700 /home/devops/.ssh
    # chmod 600 /home/devops/.ssh/authorized_keys

    # kubectl 자동완성 설정
    echo "source <(kubectl completion bash)" >> /home/devops/.bashrc
    echo "alias k=kubectl" >> /home/devops/.bashrc
    echo "complete -o default -F __start_kubectl k" >> /home/devops/.bashrc

    # SSH 데몬 실행 (포그라운드)
    echo "Starting SSH Server..."
    /usr/sbin/sshd -D
---
# 5. Deployment: Bastion Pod 배포
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-bastion
  namespace: aiops
  labels:
    app: bastion-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bastion-server
  template:
    metadata:
      labels:
        app: bastion-server
    spec:
      serviceAccountName: aiops-king-sa

      # [중요] 컨트롤 노드와 분리: Control-plane이 아닌 노드에 스케줄링되도록 강제
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

      containers:
      - name: bastion
        image: ubuntu:22.04
        command: ["/bin/bash", "/scripts/setup.sh"]
        ports:
        - containerPort: 22
        volumeMounts:
        - name: init-script
          mountPath: /scripts
        securityContext:
          privileged: false # 필요시 true로 변경 (디바이스 접근 등)
      volumes:
      - name: init-script
        configMap:
          name: bastion-init-script
          defaultMode: 0755
---
# 6. Service: 외부 접속용 NodePort
apiVersion: v1
kind: Service
metadata:
  name: aiops-bastion-svc
  namespace: aiops
spec:
  type: NodePort
  selector:
    app: bastion-server
  ports:
  - port: 22
    targetPort: 22
    nodePort: 32222 # 외부에서 접속할 포트 (30000-32767 사이)
