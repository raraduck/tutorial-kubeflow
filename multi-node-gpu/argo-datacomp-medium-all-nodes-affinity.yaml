apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: datacomp-download-
  namespace: dwnkim
  labels:
    workflows.argoproj.io/archive-strategy: "false"
spec:
  entrypoint: datacomp-distributed-download
  serviceAccountName: default-editor
  
  # [설정] 노드 3개 * 4개씩 = 12개 (자원이 넉넉하므로)
  parallelism: 12

  # -----------------------------------------------------------
  # [수정 위치] podSpecPatch 내부에 affinity 추가
  # -----------------------------------------------------------
  podSpecPatch: |
    # [추가됨] 파드를 노드별로 최대한 분산시키는 설정
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: workflows.argoproj.io/workflow
                operator: Exists
            topologyKey: kubernetes.io/hostname

    initContainers:
    - name: init
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
    containers:
    - name: wait
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
  
  volumes:
  - name: metadata-storage
    hostPath: {path: /data1/datacomp-medium/metadata, type: Directory}
  - name: output-storage
    hostPath: {path: /data2, type: Directory}

  templates:
  - name: datacomp-distributed-download
    steps:
    - - name: generate-list
        template: list-parquet-files
    - - name: download-worker
        template: img2dataset-worker
        arguments:
          parameters:
          - name: parquet-file
            value: "{{item}}"
        withParam: "{{steps.generate-list.outputs.parameters.file-list}}"

  # [Template 1: 파일 리스트 생성기]
  - name: list-parquet-files
    container:
      image: dwnusa/img2dataset-worker:v1
      command: ["/bin/bash", "-c"]
      args:
      - |
        python3 << 'EOF'
        import os, json, glob
        search_path = "/input_meta"
        output_file = "/tmp/output.json"
        if not os.path.exists(search_path): exit(1)
        files = glob.glob(os.path.join(search_path, "**", "*.parquet"), recursive=True)
        files.sort()
        print(f"Found {len(files)} parquet files")
        with open(output_file, 'w') as f: json.dump(files, f)
        EOF
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: 1, memory: 2Gi}
      volumeMounts:
      - name: metadata-storage
        mountPath: /input_meta
        readOnly: true
    outputs:
      parameters:
      - name: file-list
        valueFrom: {path: /tmp/output.json}

  # [Template 2: 다운로드 워커]
  - name: img2dataset-worker
    inputs:
      parameters:
      - name: parquet-file
    retryStrategy:
      limit: 2
    activeDeadlineSeconds: 21600
    container:
      image: dwnusa/img2dataset-worker:v1
      env:
      - name: NO_ALBUMENTATIONS_UPDATE
        value: "1"
      command: ["/bin/bash", "-c"]
      args:
      - |
        AVAILABLE_KB=$(df -P /output_data | awk 'NR==2 {print $4}')
        LIMIT_KB=104857600
        if [ "$AVAILABLE_KB" -lt "$LIMIT_KB" ]; then exit 1; fi

        INPUT_FILE="{{inputs.parameters.parquet-file}}"
        FILENAME=$(basename "$INPUT_FILE" .parquet)
        OUTPUT_DIR="/output_data/$FILENAME"
        
        echo "Processing: $INPUT_FILE"
        
        img2dataset \
          --url_list "$INPUT_FILE" \
          --input_format "parquet" \
          --url_col "url" \
          --caption_col "text" \
          --output_format webdataset \
          --output_folder "$OUTPUT_DIR" \
          --processes_count 6 \
          --thread_count 64 \
          --image_size 224 \
          --resize_mode center_crop \
          --encode_format webp \
          --encode_quality 75 \
          --retries 2 \
          --min_image_size 50 \
          --request_timeout 60 \
          --enable_wandb False
        
        echo "✅ Completed: $FILENAME"
      resources:
        requests:
          cpu: 4
          memory: 16Gi
        limits:
          cpu: 8
          memory: 64Gi
      volumeMounts:
      - name: metadata-storage
        mountPath: /input_meta
        readOnly: true
      - name: output-storage
        mountPath: /output_data
        readOnly: false