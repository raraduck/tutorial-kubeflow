apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: datacomp-download-
  namespace: aiops
spec:
  entrypoint: datacomp-distributed-download
  # 동시에 실행할 파드 수 (병렬 처리 수준)
  parallelism: 5
  
  # [핵심 수정] PVC 대신 HostPath 볼륨 사용
  volumes:
  - name: workdir
    hostPath:
      # 호스트(노드)의 실제 경로
      path: /mnt/GPU_storage/datasets/datacomp-medium
      type: Directory

  templates:
  - name: datacomp-distributed-download
    steps:
    # 1단계: Parquet 파일 목록 읽기
    - - name: generate-list
        template: list-parquet-files
        arguments:
          parameters:
          - name: metadata-path
            # 컨테이너 내부는 /data 에 마운트되므로 경로는 아래와 같음
            value: "/data/metadata"

    # 2단계: 병렬 다운로드 수행
    - - name: download-worker
        template: img2dataset-worker
        arguments:
          parameters:
          - name: parquet-file
            value: "{{item}}"
          - name: base-output-path
            value: "/data/images"
        withParam: "{{steps.generate-list.outputs.parameters.file-list}}"

  # ---------------------------------------------------------
  # Template 1: 파일 리스트 생성기
  # ---------------------------------------------------------
  - name: list-parquet-files
    inputs:
      parameters:
      - name: metadata-path
    script:
      image: python:3.10-slim
      command: [python]
      source: |
        import os
        import json
        import glob
        
        path = "{{inputs.parameters.metadata-path}}"
        
        # 경로 확인 (디버깅용)
        if not os.path.exists(path):
            print(f"ERROR: Path {path} not found inside container.")
            exit(1)

        files = glob.glob(os.path.join(path, "*.parquet"))
        files.sort()
        
        # Argo는 표준출력(stdout)을 캡처합니다
        print(json.dumps(files))
      volumeMounts:
      - name: workdir
        mountPath: /data # HostPath가 컨테이너 내부 /data 에 연결됨

    outputs:
      parameters:
      - name: file-list
        valueFrom:
          default: "[]"
          path: /tmp/output_list

  # ---------------------------------------------------------
  # Template 2: 다운로드 워커
  # ---------------------------------------------------------
  - name: img2dataset-worker
    inputs:
      parameters:
      - name: parquet-file
      - name: base-output-path
    retryStrategy:
      limit: 2
    container:
      image: python:3.10
      command: ["/bin/bash", "-c"]
      args:
      - |
        pip install img2dataset pyarrow pandas
        
        INPUT_FILE="{{inputs.parameters.parquet-file}}"
        FILENAME=$(basename "$INPUT_FILE" .parquet)
        OUTPUT_DIR="{{inputs.parameters.base-output-path}}/$FILENAME"
        
        echo "Processing: $INPUT_FILE"
        
        # [수정됨] 용량 최적화 옵션 적용
        img2dataset \
          --url_list "$INPUT_FILE" \
          --input_format "parquet" \
          --url_col "url" \
          --caption_col "text" \
          --output_format webdataset \
          --output_folder "$OUTPUT_DIR" \
          --processes_count 4 \
          --thread_count 32 \
          --image_size 224 \
          --resize_mode center_crop \
          --encode_format webp \
          --encode_quality 90 \
          --retries 1 \
          --min_image_size 200
      
      resources:
        requests:
          cpu: 2
          memory: 4Gi
        limits:
          cpu: 4
          memory: 8Gi
      
      volumeMounts:
      - name: workdir
        mountPath: /data