apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: datacomp-download-
  namespace: aiops  # 사용하시는 네임스페이스
spec:
  entrypoint: datacomp-distributed-download
  # 동시에 실행될 최대 파드 수 제한 (네트워크 대역폭 폭발 방지)
  parallelism: 5 
  
  volumeClaimTemplates:
  - metadata:
      name: workdir
    spec:
      accessModes: [ "ReadWriteMany" ] # NFS 등 공유 스토리지 필수
      resources:
        requests:
          storage: 1Ti # 충분한 용량 확보 필요

  templates:
  - name: datacomp-distributed-download
    steps:
    # 1단계: 파케이 파일 목록 생성
    - - name: generate-list
        template: list-parquet-files
        arguments:
          parameters:
          - name: metadata-path
            value: "/data/datacomp-medium/metadata/data" # 메타데이터 경로

    # 2단계: 파일별로 파드 생성하여 병렬 다운로드
    - - name: download-worker
        template: img2dataset-worker
        arguments:
          parameters:
          - name: parquet-file
            value: "{{item}}"
          - name: base-output-path
            value: "/data/datacomp-medium/images"
        withParam: "{{steps.generate-list.outputs.parameters.file-list}}"

  # ---------------------------------------------------------
  # Template 1: Parquet 파일 목록을 JSON 리스트로 변환
  # ---------------------------------------------------------
  - name: list-parquet-files
    inputs:
      parameters:
      - name: metadata-path
    script:
      image: python:3.10-slim
      command: [python]
      source: |
        import os
        import json
        import glob

        # 메타데이터 경로 (Volume 마운트 경로 기준)
        path = "{{inputs.parameters.metadata-path}}"
        
        # .parquet 파일 찾기
        files = glob.glob(os.path.join(path, "*.parquet"))
        
        # 전체 경로가 아닌 파일명만 추출하거나, 전체 경로 사용 가능
        # 여기서는 전체 경로 리스트로 반환
        files.sort()
        
        # JSON 형태로 출력 (Argo가 파싱함)
        print(json.dumps(files))
      volumeMounts:
      - name: workdir
        mountPath: /data

    outputs:
      parameters:
      - name: file-list
        valueFrom:
          default: "[]"
          path: /tmp/output_list # script의 stdout을 캡처

  # ---------------------------------------------------------
  # Template 2: 실제 다운로드를 수행하는 워커
  # ---------------------------------------------------------
  - name: img2dataset-worker
    inputs:
      parameters:
      - name: parquet-file
      - name: base-output-path
    retryStrategy:
      limit: 2 # 실패 시 2회 재시도
    container:
      image: python:3.10
      command: ["/bin/bash", "-c"]
      args:
      - |
        # 1. img2dataset 설치 (이미지를 미리 빌드해두면 이 과정 생략 가능)
        pip install img2dataset pyarrow pandas
        
        # 2. 입력 파일명에서 식별자 추출 (폴더 겹침 방지)
        INPUT_FILE="{{inputs.parameters.parquet-file}}"
        FILENAME=$(basename "$INPUT_FILE" .parquet)
        OUTPUT_DIR="{{inputs.parameters.base-output-path}}/$FILENAME"
        
        echo "Processing $INPUT_FILE -> $OUTPUT_DIR"
        
        # 3. img2dataset 실행
        img2dataset \
          --url_list "$INPUT_FILE" \
          --input_format "parquet" \
          --url_col "url" \
          --caption_col "text" \
          --output_format webdataset \
          --output_folder "$OUTPUT_DIR" \
          --processes_count 4 \
          --thread_count 32 \
          --image_size 256 \
          --resize_mode keep_ratio \
          --retries 1 \
          --min_image_size 200
      
      resources:
        requests:
          cpu: 2
          memory: 4Gi
        limits:
          cpu: 4
          memory: 8Gi
      
      volumeMounts:
      - name: workdir
        mountPath: /data